# Cloud Build CI/CD for Cloud Run staging.
#
# Intended trigger:
# - GitHub repository trigger for the staging branch.
# - Build config: this file.
# - Required Cloud Build service account permissions:
#   Cloud Run Admin, Artifact Registry Writer, Service Account User,
#   Secret Manager Secret Accessor for the runtime secrets referenced below.

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: ruan-ai-staging
  _AR_REPOSITORY: cloud-run-source-deploy
  _PROVIDER_MODE: real
  _JOB_EXECUTION_MODE: inline
  _GITHUB_LIVE_OWNER: MinhWorker
  _GITHUB_LIVE_REPO: ruan-ai
  _PRIMARY_MODEL_ID: gemma-4-31b-it
  _FALLBACK_MODEL_ID: gemma-4-26b-a4b-it
  _AI_MODEL_TIMEOUT_MS: '120000'
  _CLOUD_RUN_TIMEOUT_SECONDS: '300'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: install
    name: node:22
    entrypoint: npm
    args: ['ci']

  - id: build
    name: node:22
    entrypoint: npm
    args: ['run', 'build']
    env:
      - GITHUB_WEBHOOK_SECRET=ci-test-secret
      - PROVIDER_MODE=fake
      - JOB_EXECUTION_MODE=queued

  - id: lint-check
    name: node:22
    entrypoint: npx
    args:
      - eslint
      - '{src,apps,libs,test}/**/*.ts'
      - --max-warnings=0

  - id: unit-tests
    name: node:22
    entrypoint: npx
    args: ['jest', '--runInBand']
    env:
      - GITHUB_WEBHOOK_SECRET=ci-test-secret
      - PROVIDER_MODE=fake
      - JOB_EXECUTION_MODE=queued

  - id: e2e-tests
    name: node:22
    entrypoint: npm
    args: ['run', 'test:e2e']
    env:
      - GITHUB_WEBHOOK_SECRET=ci-test-secret
      - PROVIDER_MODE=fake
      - JOB_EXECUTION_MODE=queued

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  - id: docker-push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA

  - id: docker-push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=${_CLOUD_RUN_TIMEOUT_SECONDS}
      - --set-env-vars=PROVIDER_MODE=${_PROVIDER_MODE},JOB_EXECUTION_MODE=${_JOB_EXECUTION_MODE},GITHUB_LIVE_OWNER=${_GITHUB_LIVE_OWNER},GITHUB_LIVE_REPO=${_GITHUB_LIVE_REPO},PRIMARY_MODEL_ID=${_PRIMARY_MODEL_ID},FALLBACK_MODEL_ID=${_FALLBACK_MODEL_ID},AI_MODEL_TIMEOUT_MS=${_AI_MODEL_TIMEOUT_MS}
      - --update-secrets=GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest,GITHUB_APP_ID=GITHUB_APP_ID:latest,GITHUB_APP_PRIVATE_KEY=GITHUB_APP_PRIVATE_KEY:latest,GOOGLE_AI_STUDIO_API_KEY=GOOGLE_AI_STUDIO_API_KEY:latest
      - --quiet

  - id: smoke-health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SERVICE_URL="$(gcloud run services describe "${_SERVICE_NAME}" --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')"
        curl --fail --show-error --silent "${SERVICE_URL}/health"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest
