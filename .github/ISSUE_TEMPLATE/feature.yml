name: Feature
description: Request a scoped product or engineering feature.
title: '[Feature]: '
labels: ['type:feature', 'status:triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be included?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: What must stay out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List the observable requirements that prove the feature is done.
      placeholder: |
        -
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which commands or checks should prove the change?
      placeholder: |
        - npm run build
        - npx jest --runInBand
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Impact
      options:
        - No deployment impact
        - Requires staging deploy
        - Changes CI/CD or Cloud Run configuration
        - Requires official release
    validations:
      required: true
