name: Bug
description: Report a reproducible bug or regression.
title: '[Bug]: '
labels: ['type:bug', 'status:triage']
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, payloads, commands, or links needed to reproduce.
      placeholder: |
        1. 
        2. 
        3.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, build IDs, Cloud Run revision, issue links, or test output.
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 production/staging outage
        - P1 core workflow broken
        - P2 important but workaround exists
        - P3 minor
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Impact
      options:
        - No deployment impact
        - Requires staging deploy
        - Changes CI/CD or Cloud Run configuration
        - Requires official release
    validations:
      required: true
