name: Staging Deployment Status

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-deployment-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-surface:
    name: Validate and Surface Deployment Status
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: gen-lang-client-0591588109
      CLOUD_RUN_REGION: us-central1
      CLOUD_RUN_SERVICE: ruan-ai-staging
      STAGING_HEALTH_URL: https://ruan-ai-staging-309117600688.us-central1.run.app/health
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build
        env:
          GITHUB_WEBHOOK_SECRET: ci-test-secret

      - name: Run Lint Check
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Run Unit Tests
        run: npx jest --runInBand
        env:
          GITHUB_WEBHOOK_SECRET: ci-test-secret

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          GITHUB_WEBHOOK_SECRET: ci-test-secret

      - name: Surface Deployment Information
        if: always()
        run: |
          echo "## Staging Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cloud Build remains the only deployment executor. This GitHub Actions workflow performs local validation and surfaces monitoring links for the Cloud Build trigger that watches the \`staging\` branch." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This baseline workflow does not authenticate to Google Cloud, so it does not assert the final Cloud Build result. Use the Cloud Build link below for the authoritative deploy status." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Monitor Deployment And Services" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Location | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **GCP Cloud Build** | [Cloud Build Job (Commit ${{ github.sha }})](https://console.cloud.google.com/cloud-build/builds?project=${GCP_PROJECT_ID}&query=commit_sha%3D%22${{ github.sha }}%22) | View the authoritative build, image, deploy, and smoke-check result. |" >> $GITHUB_STEP_SUMMARY
          echo "| **GCP Cloud Run** | [Cloud Run Service Revisions](https://console.cloud.google.com/run/detail/${CLOUD_RUN_REGION}/${CLOUD_RUN_SERVICE}/revisions?project=${GCP_PROJECT_ID}) | View deployed revisions, traffic allocations, and runtime settings. |" >> $GITHUB_STEP_SUMMARY
          echo "| **GCP Cloud Run Logs** | [Service Logs](https://console.cloud.google.com/run/detail/${CLOUD_RUN_REGION}/${CLOUD_RUN_SERVICE}/logs?project=${GCP_PROJECT_ID}) | Access application stdout/stderr for the staging service. |" >> $GITHUB_STEP_SUMMARY
          echo "| **Staging URL** | [ruan-ai-staging Health Check](${STAGING_HEALTH_URL}) | Manually smoke check the live staging health endpoint. |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Promotion Flow Reminder" >> $GITHUB_STEP_SUMMARY
          echo "- To promote these staging changes to production/official release, open a pull request from \`staging\` to \`main\`." >> $GITHUB_STEP_SUMMARY
          echo "- Version tagging (\`v0.x.x\`) should only occur after a formal release decision is approved." >> $GITHUB_STEP_SUMMARY
